<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pulseline app · Bazozo Studio demo</title>
<meta name="description" content="The Pulseline app itself, loaded inside the phone and desktop frames of the Pulseline showcase.">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://bazozo.in/work/pulseline.html">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<script src="pulseline-mode.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Petrona:wght@500;600;700&family=Wix+Madefor+Text:wght@400;500;600;700;800&family=Kode+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EAF5F1;
  --text:#0E2B29;
  --accent:#FF7A59;
  --teal:#0B4F4A;
  --teal-2:#137A70;
  --mint:#BFE6D8;
  --surface:#FFFFFF;
  --surface-2:#F4FAF8;
  --dim:#4F6B68;
  --faint:#8AA3A0;
  --line:#D5E8E1;
  --ok:#1E9E6A;
  --warn:#E09A2E;
  --live:#E5484D;
  --accent-soft:rgba(255,122,89,.14);
  --teal-soft:rgba(19,122,112,.1);
  --serif:'Petrona', Georgia, serif;
  --body:'Wix Madefor Text', system-ui, sans-serif;
  --mono:'Kode Mono', ui-monospace, monospace;
  --r:28px;
  --spring:cubic-bezier(.34,1.56,.64,1);
  --ease:cubic-bezier(.2,.8,.2,1);
  --shadow:0 1px 2px rgba(14,43,41,.05), 0 14px 30px -18px rgba(14,43,41,.28);
}
*{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
[hidden]{ display:none !important; }
html{ background:var(--bg); -webkit-text-size-adjust:100%; }
body{ background:var(--bg); color:var(--text); font-family:var(--body); font-size:16px; line-height:1.45; overflow-x:clip; -webkit-font-smoothing:antialiased; }
html.framed, html.framed body{ scrollbar-width:none; } html.framed ::-webkit-scrollbar{ display:none; }
button, input, select, textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; border:0; background:none; }
a{ color:inherit; text-decoration:none; }
h1,h2,h3{ font-family:var(--serif); font-weight:600; letter-spacing:-.015em; line-height:1.12; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:12px; }
.mono{ font-family:var(--mono); }

/* atoms */
.btn{ --b:var(--teal); display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:46px; padding:0 20px; border-radius:999px; font-weight:800; font-size:16px; white-space:nowrap; transition:transform .35s var(--spring), box-shadow .3s, background .2s, opacity .2s; }
.btn svg{ width:18px; height:18px; flex:none; }
.btn-solid{ background:var(--b); color:#fff; box-shadow:0 10px 22px -12px var(--b); }
.btn-solid:hover{ box-shadow:0 0 0 5px color-mix(in srgb, var(--b) 16%, transparent), 0 12px 26px -12px var(--b); }
.btn-coral{ --b:var(--accent); }
.btn-soft{ background:var(--teal-soft); color:var(--teal); }
.btn-line{ border:1.5px solid var(--line); background:var(--surface); }
.btn-line:hover{ border-color:var(--teal-2); }
.btn-block{ width:100%; }
.btn-sm{ min-height:36px; padding:0 14px; font-size:15px; }
.btn:active{ transform:scale(.95); }
.btn[disabled]{ opacity:.45; pointer-events:none; }
.icon-btn{ width:42px; height:42px; border-radius:50%; display:inline-grid; place-items:center; color:var(--dim); transition:background .2s, color .2s, transform .3s var(--spring); position:relative; }
.icon-btn:hover{ background:var(--teal-soft); color:var(--teal); }
.icon-btn:active{ transform:scale(.9); }
.icon-btn svg{ width:20px; height:20px; }
.pill{ display:inline-flex; align-items:center; gap:5px; height:24px; padding:0 10px; border-radius:999px; font-size:13px; font-weight:800; white-space:nowrap; }
.pill svg{ width:13px; height:13px; }
.p-wait{ background:#FFF2DC; color:#9A5E00; }
.p-in{ background:var(--accent-soft); color:#C2482A; }
.p-done{ background:#E1F4EA; color:#137A4C; }
.p-video{ background:#ECEBFF; color:#4B44C7; }
.p-cancel{ background:#F1F1F1; color:#8A8A8A; }
.p-paid{ background:var(--teal-soft); color:var(--teal); }
.dot{ width:7px; height:7px; border-radius:50%; background:currentColor; animation:blink 1.3s infinite; }
@keyframes blink{ 50%{ opacity:.3; } }
.av{ width:42px; height:42px; border-radius:50%; display:grid; place-items:center; flex:none; color:#fff; font-weight:800; font-size:16px; background:var(--c, var(--teal-2)); }
.blob{ border-radius:58% 42% 55% 45% / 48% 56% 44% 52%; }
.card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); }
.field{ display:grid; gap:6px; margin-bottom:12px; }
.field label{ font-size:14px; font-weight:700; color:var(--dim); }
.input, .select, .textarea{ width:100%; min-height:46px; padding:0 16px; border-radius:16px; border:1.5px solid var(--line); background:var(--surface); outline:none; font-size:16px; transition:border-color .2s, box-shadow .25s; }
.textarea{ padding:12px 16px; min-height:80px; resize:none; }
.input:focus, .select:focus, .textarea:focus{ border-color:var(--teal-2); box-shadow:0 0 0 4px var(--teal-soft); }
.hint{ color:var(--faint); font-size:14px; }
.empty{ text-align:center; padding:26px 12px; color:var(--dim); font-size:16px; }
.pulse-line{ display:block; width:100%; height:28px; }
.pulse-line path{ fill:none; stroke:var(--accent); stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:240; stroke-dashoffset:240; animation:ecg 2.4s linear infinite; }
@keyframes ecg{ to{ stroke-dashoffset:-240; } }
.toasts{ position:fixed; z-index:120; left:50%; top:14px; transform:translateX(-50%); display:grid; gap:8px; width:min(92vw,440px); pointer-events:none; }
.toast{ display:flex; align-items:center; gap:10px; padding:13px 17px; border-radius:20px; background:var(--teal); color:#fff; font-size:15.5px; font-weight:600; box-shadow:0 16px 32px -12px rgba(11,79,74,.55); }
.toast svg{ width:18px; height:18px; color:var(--mint); flex:none; }

/* ================= PATIENT (phone) ================= */
.pt{ min-height:100vh; min-height:100dvh; padding:6px 16px 120px; }
.pt-top{ display:flex; align-items:center; gap:12px; padding:10px 0 6px; }
.pt-top .t{ flex:1; min-width:0; }
.pt-top .t span{ display:block; font-size:14px; color:var(--dim); }
.pt-top .t strong{ font-family:var(--serif); font-size:24px; font-weight:600; }
.pt h2{ font-size:23px; margin:22px 0 10px; display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
.pt h2 small{ font-family:var(--body); font-size:14px; font-weight:700; color:var(--teal-2); }
.next{ position:relative; overflow:hidden; border-radius:32px; padding:20px 18px 18px; color:#fff; background:var(--teal); isolation:isolate; margin-top:6px; }
.next::before{ content:''; position:absolute; z-index:-1; right:-60px; top:-70px; width:220px; height:200px; background:var(--teal-2); border-radius:58% 42% 55% 45% / 48% 56% 44% 52%; }
.next::after{ content:''; position:absolute; z-index:-1; left:-40px; bottom:-90px; width:180px; height:170px; background:rgba(255,122,89,.35); border-radius:42% 58% 45% 55% / 56% 44% 52% 48%; }
.next .row{ display:flex; align-items:center; gap:12px; }
.next .av{ background:#fff; color:var(--teal); width:46px; height:46px; }
.next .who strong{ display:block; font-size:17px; }
.next .who span{ font-size:14px; opacity:.75; }
.next .when{ margin-left:auto; text-align:right; font-family:var(--mono); font-size:14px; opacity:.85; white-space:pre-line; }
.token{ display:flex; align-items:flex-end; gap:16px; margin:18px 0 10px; }
.token .big{ font-family:var(--serif); font-size:65px; line-height:.85; }
.token .big small{ display:block; font-family:var(--mono); font-size:12px; letter-spacing:.14em; opacity:.65; margin-bottom:6px; }
.token .meta{ font-size:15px; opacity:.9; padding-bottom:4px; }
.token .meta b{ display:block; font-size:19px; }
.track{ display:flex; gap:5px; margin:6px 0 14px; }
.track i{ flex:1; height:7px; border-radius:6px; background:rgba(255,255,255,.18); }
.track i.done{ background:var(--mint); }
.track i.now{ background:var(--accent); animation:blink 1.1s infinite; }
.track i.me{ background:#fff; }
.next .btn{ --b:var(--accent); }
.turn{ display:flex; align-items:center; gap:10px; padding:12px 14px; border-radius:20px; background:var(--accent); font-weight:800; font-size:17px; margin:10px 0 4px; }
.turn svg{ width:22px; height:22px; }
.quick{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:14px; }
.quick button{ display:grid; justify-items:center; gap:7px; padding:14px 4px 12px; border-radius:24px; background:var(--surface); border:1px solid var(--line); font-size:13.5px; font-weight:700; color:var(--dim); transition:transform .35s var(--spring), border-color .25s; }
.quick button:hover{ transform:translateY(-3px); border-color:var(--teal-2); }
.quick i{ width:42px; height:42px; display:grid; place-items:center; background:var(--c); color:#fff; }
.quick i svg{ width:20px; height:20px; }
.docs{ display:grid; gap:10px; }
.doc{ display:flex; gap:12px; align-items:center; padding:12px; width:100%; text-align:left; transition:transform .35s var(--spring), border-color .25s; }
.doc:hover{ transform:translateY(-2px); border-color:var(--teal-2); }
.doc .av{ width:54px; height:54px; font-size:19px; }
.doc .t{ flex:1; min-width:0; }
.doc strong{ display:block; font-size:17px; }
.doc .t span{ display:block; font-size:14px; color:var(--dim); }
.doc .fee{ text-align:right; font-weight:800; font-size:16px; }
.doc .fee small{ display:block; font-weight:600; font-size:13px; color:var(--faint); }
.pnav{ position:fixed; z-index:40; left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom)); display:flex; align-items:center; padding:8px; border-radius:999px; background:var(--surface); border:1px solid var(--line); box-shadow:0 18px 40px -16px rgba(11,79,74,.45); }
.pnav button{ flex:1; display:grid; justify-items:center; gap:2px; padding:6px 0 4px; border-radius:999px; color:var(--faint); font-size:12.5px; font-weight:700; position:relative; transition:color .25s; }
.pnav button svg{ width:21px; height:21px; transition:transform .4s var(--spring); }
.pnav button[aria-selected="true"]{ color:var(--teal); }
.pnav button[aria-selected="true"] svg{ transform:translateY(-2px); }
.pnav .fab{ flex:none; width:58px; height:58px; margin:-30px 4px 0; border-radius:50%; background:var(--accent); color:#fff; box-shadow:0 12px 24px -8px rgba(255,122,89,.8); display:grid; place-items:center; transition:transform .4s var(--spring); }
.pnav .fab:hover{ transform:rotate(90deg) scale(1.05); }
.pnav .fab svg{ width:26px; height:26px; }
.pnav .badge{ position:absolute; top:2px; left:calc(50% + 6px); min-width:17px; height:17px; padding:0 4px; border-radius:9px; background:var(--live); color:#fff; font-size:11.5px; font-weight:800; display:grid; place-items:center; }

/* sheets (patient) */
.scrim{ position:fixed; inset:0; z-index:80; background:rgba(11,43,41,.45); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); display:flex; align-items:flex-end; justify-content:center; }
.sheet{ position:relative; width:100%; max-height:93vh; max-height:93dvh; overflow:auto; background:var(--bg); border-radius:34px 34px 0 0; padding:22px 18px calc(22px + env(safe-area-inset-bottom)); }
.sheet::before{ content:''; display:block; width:44px; height:5px; border-radius:5px; background:var(--line); margin:-8px auto 14px; }
.sheet .x{ position:absolute; right:12px; top:12px; z-index:3; }
.sheet h2{ font-size:26px; padding-right:44px; }
.sheet .lead{ color:var(--dim); font-size:16px; margin-top:6px; }
.steps-bar{ display:flex; gap:6px; margin:14px 0 16px; }
.steps-bar i{ flex:1; height:5px; border-radius:5px; background:var(--line); transition:background .4s; }
.steps-bar i.on{ background:var(--teal-2); }
.seg{ display:flex; padding:4px; border-radius:999px; background:var(--surface); border:1px solid var(--line); }
.seg button{ flex:1; height:42px; border-radius:999px; font-weight:800; font-size:15px; color:var(--dim); display:flex; align-items:center; justify-content:center; gap:7px; transition:background .3s, color .3s; }
.seg button svg{ width:17px; height:17px; }
.seg button[aria-pressed="true"]{ background:var(--teal); color:#fff; }
.days{ display:flex; gap:8px; overflow-x:auto; padding:4px 0 8px; scrollbar-width:none; }
.days::-webkit-scrollbar{ display:none; }
.days button{ flex:none; width:62px; padding:10px 0; border-radius:22px; border:1.5px solid var(--line); background:var(--surface); display:grid; justify-items:center; gap:1px; transition:all .25s; }
.days button span{ font-size:13px; font-weight:700; color:var(--faint); }
.days button b{ font-family:var(--serif); font-size:24px; }
.days button[aria-pressed="true"]{ background:var(--teal); border-color:var(--teal); color:#fff; }
.days button[aria-pressed="true"] span{ color:var(--mint); }
.slot-h{ font-size:14px; font-weight:800; color:var(--faint); text-transform:uppercase; letter-spacing:.08em; margin:14px 0 8px; display:flex; align-items:center; gap:6px; }
.slot-h svg{ width:15px; height:15px; }
.slots{ display:grid; grid-template-columns:repeat(4,1fr); gap:7px; }
.slots button{ height:40px; border-radius:999px; border:1.5px solid var(--line); background:var(--surface); font-family:var(--mono); font-size:14.5px; font-weight:600; transition:all .2s; }
.slots button[aria-pressed="true"]{ background:var(--accent); border-color:var(--accent); color:#fff; }
.slots button[disabled]{ opacity:.35; text-decoration:line-through; pointer-events:none; }
.sum{ padding:16px; border-radius:24px; background:var(--surface); border:1px solid var(--line); display:grid; gap:10px; margin:14px 0; font-size:16px; }
.sum div{ display:flex; justify-content:space-between; gap:10px; }
.sum span{ color:var(--dim); }
.sum .tot{ border-top:1px dashed var(--line); padding-top:10px; font-weight:800; font-size:18px; }
.upi{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px; }
.upi button{ height:50px; border-radius:18px; border:1.5px solid var(--line); background:var(--surface); font-weight:800; font-size:15px; color:var(--dim); transition:all .25s; }
.upi button[aria-pressed="true"]{ border-color:var(--teal-2); color:var(--teal); background:var(--teal-soft); }
.center{ display:grid; justify-items:center; gap:12px; text-align:center; padding:22px 0 8px; }
.spinner{ width:46px; height:46px; border-radius:50%; border:4px solid var(--line); border-top-color:var(--teal-2); animation:spin .8s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }
.tick{ width:70px; height:70px; display:grid; place-items:center; background:var(--ok); color:#fff; }
.tick svg{ width:34px; height:34px; }
.visit{ display:flex; gap:12px; align-items:center; padding:14px; margin-bottom:10px; }
.visit .d{ width:56px; flex:none; text-align:center; padding:8px 0; border-radius:20px; background:var(--teal-soft); color:var(--teal); }
.visit .d b{ display:block; font-family:var(--serif); font-size:24px; line-height:1; }
.visit .d span{ font-size:12.5px; font-weight:800; text-transform:uppercase; }
.visit .t{ flex:1; min-width:0; }
.visit strong{ display:block; font-size:16.5px; }
.visit .t > span{ display:block; font-size:14px; color:var(--dim); margin:2px 0 6px; }
.visit .acts{ display:flex; gap:6px; margin-top:8px; }
.rx-row{ display:flex; gap:12px; align-items:center; width:100%; text-align:left; padding:14px; margin-bottom:10px; transition:transform .35s var(--spring); }
.rx-row:hover{ transform:translateY(-2px); }
.rx-row i{ width:46px; height:46px; display:grid; place-items:center; background:var(--accent-soft); color:var(--accent); flex:none; font-family:var(--serif); font-style:italic; font-size:22px; font-weight:700; }
.rx-row .t{ flex:1; min-width:0; }
.rx-row strong{ display:block; font-size:16.5px; }
.rx-row span{ font-size:14px; color:var(--dim); }
.rx-row.new{ border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); }
.rx{ position:relative; padding:20px; border-radius:26px; background:#fff; border:1px solid var(--line); }
.rx-head{ display:flex; justify-content:space-between; gap:10px; padding-bottom:12px; border-bottom:2px solid var(--teal); }
.rx-head strong{ font-family:var(--serif); font-size:20px; color:var(--teal); display:block; }
.rx-head span{ font-size:13.5px; color:var(--dim); display:block; }
.rx-sym{ font-family:var(--serif); font-style:italic; font-size:35px; color:var(--accent); line-height:1; margin:12px 0 4px; }
.rx table{ width:100%; border-collapse:collapse; font-size:15px; }
.rx td{ padding:8px 0; border-bottom:1px dashed var(--line); vertical-align:top; }
.rx td:last-child{ text-align:right; font-family:var(--mono); font-size:14px; color:var(--dim); white-space:nowrap; }
.rx td strong{ display:block; }
.rx td small{ color:var(--dim); }
.rx .adv{ margin-top:12px; font-size:15px; color:var(--dim); overflow-wrap:anywhere; }
.rx .sign{ margin-top:16px; text-align:right; font-family:var(--serif); font-style:italic; color:var(--teal); }
.wa{ display:grid; gap:10px; padding:14px; border-radius:28px; background:#E4DDD4; background-image:radial-gradient(rgba(0,0,0,.04) 1px, transparent 1.5px); background-size:14px 14px; }
.wa-head{ display:flex; align-items:center; gap:10px; padding:0 4px 6px; }
.wa-head .av{ width:36px; height:36px; font-size:14px; }
.wa-head strong{ font-size:15.5px; display:block; }
.wa-head span{ font-size:13px; color:#5E7E6B; }
.bub{ justify-self:start; max-width:88%; padding:9px 12px 7px; border-radius:4px 18px 18px 18px; background:#fff; font-size:15px; box-shadow:0 1px 1px rgba(0,0,0,.08); overflow-wrap:anywhere; }
.bub small{ display:block; text-align:right; font-size:12px; color:#8A9A90; margin-top:3px; }
.bub small b{ color:#34B7F1; font-weight:800; }
.call{ position:fixed; inset:0; z-index:90; display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding:70px 24px 50px; color:#fff; background:radial-gradient(120% 80% at 50% 20%, var(--teal-2), #06302C 70%); }
.call .av{ width:120px; height:120px; font-size:41px; background:#fff; color:var(--teal); box-shadow:0 0 0 14px rgba(255,255,255,.08), 0 0 0 30px rgba(255,255,255,.05); }
.call h2{ font-size:29px; margin-top:22px; text-align:center; }
.call p{ opacity:.75; text-align:center; margin-top:6px; }
.call .acts{ display:flex; gap:60px; }
.round{ width:70px; height:70px; border-radius:50%; display:grid; place-items:center; color:#fff; transition:transform .35s var(--spring); }
.round:hover{ transform:scale(1.08); }
.round svg{ width:28px; height:28px; }
.round.go{ background:#22C55E; box-shadow:0 0 0 0 rgba(34,197,94,.6); animation:ring 1.4s infinite; }
.round.stop{ background:var(--live); }
@keyframes ring{ 70%{ box-shadow:0 0 0 22px rgba(34,197,94,0); } 100%{ box-shadow:0 0 0 0 rgba(34,197,94,0); } }
.vroom{ position:fixed; inset:0; z-index:90; background:#06201E; color:#fff; display:flex; flex-direction:column; }
.vfeed{ position:relative; flex:1; overflow:hidden; display:grid; place-items:center; background:radial-gradient(90% 70% at 50% 35%, #1F5E57, #06201E 75%); }
.vfeed svg.person{ width:78%; max-width:420px; }
.vself{ position:absolute; right:14px; top:14px; width:28%; max-width:180px; aspect-ratio:3/4; border-radius:22px; overflow:hidden; background:linear-gradient(180deg,#3B4A63,#1E2738); border:2px solid rgba(255,255,255,.25); display:grid; place-items:end center; }
.vself svg{ width:90%; }
.vtag{ position:absolute; left:14px; top:14px; display:flex; align-items:center; gap:7px; padding:6px 12px; border-radius:999px; background:rgba(0,0,0,.4); font-size:14px; font-weight:700; }
.vtag i{ width:8px; height:8px; border-radius:50%; background:var(--live); animation:blink 1.2s infinite; }
.vbar{ display:flex; justify-content:center; gap:16px; padding:16px 0 calc(22px + env(safe-area-inset-bottom)); background:#06201E; }
.vbar .round{ width:58px; height:58px; background:rgba(255,255,255,.12); }
.vbar .round.stop{ background:var(--live); }
.vbar .round[aria-pressed="true"]{ background:#fff; color:#06201E; }
.vcap{ position:absolute; left:50%; bottom:16px; transform:translateX(-50%); padding:8px 14px; border-radius:14px; background:rgba(0,0,0,.45); font-size:14.5px; max-width:86%; text-align:center; }

/* ================= CLINIC (desktop) ================= */
.cl{ display:grid; grid-template-columns:232px minmax(0,1fr); min-height:100vh; min-height:100dvh; }
.rail{ position:sticky; top:0; height:100vh; height:100dvh; display:flex; flex-direction:column; gap:6px; padding:20px 16px; background:var(--teal); color:#fff; }
.rail .brand{ display:flex; align-items:center; gap:10px; padding:2px 6px 18px; }
.rail .brand .mk{ width:38px; height:38px; display:grid; place-items:center; background:var(--accent); }
.rail .brand .mk svg{ width:22px; height:22px; }
.rail .brand strong{ font-family:var(--serif); font-size:21px; display:block; }
.rail .brand span{ font-size:13px; opacity:.6; display:block; }
.rail nav button{ display:flex; align-items:center; gap:12px; width:100%; height:48px; padding:0 14px; border-radius:999px; font-weight:700; font-size:16px; color:rgba(255,255,255,.72); transition:background .25s, color .25s; }
.rail nav button svg{ width:20px; height:20px; }
.rail nav button:hover{ background:rgba(255,255,255,.08); color:#fff; }
.rail nav button[aria-selected="true"]{ background:#fff; color:var(--teal); }
.rail nav button .n{ margin-left:auto; font-family:var(--mono); font-size:13px; padding:1px 8px; border-radius:999px; background:var(--accent); color:#fff; }
.rail .me{ margin-top:auto; display:flex; align-items:center; gap:10px; padding:12px; border-radius:24px; background:rgba(255,255,255,.08); }
.rail .me .av{ width:40px; height:40px; background:#fff; color:var(--teal); font-size:15px; }
.rail .me strong{ display:block; font-size:15px; }
.rail .me span{ white-space:nowrap;  font-size:13px; opacity:.65; }
.cmain{ min-width:0; padding:20px 26px 30px; }
.chead{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.chead h1{ font-size:32px; }
.chead p{ color:var(--dim); font-size:15px; }
.chead .right{ margin-left:auto; display:flex; align-items:center; gap:10px; }
.docpick{ display:flex; gap:6px; padding:5px; border-radius:999px; background:var(--surface); border:1px solid var(--line); }
.docpick button{ display:flex; align-items:center; gap:8px; height:40px; padding:0 14px 0 5px; border-radius:999px; font-size:14.5px; font-weight:700; color:var(--dim); transition:background .25s, color .25s; }
.docpick button .av{ width:31px; height:31px; font-size:13px; }
.docpick button[aria-pressed="true"]{ background:var(--teal-soft); color:var(--teal); }
.live-chip{ display:flex; align-items:center; gap:7px; font-family:var(--mono); font-size:13.5px; color:var(--ok); padding:8px 12px; border-radius:999px; background:#E1F4EA; }
.kpis{ display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin:18px 0; }
.kpi{ padding:16px 18px; border-radius:26px; background:var(--surface); border:1px solid var(--line); }
.kpi span{ font-size:14px; font-weight:700; color:var(--dim); }
.kpi b{ display:block; font-family:var(--serif); font-size:32px; margin-top:4px; }
.kpi.hot{ background:var(--accent); border-color:transparent; color:#fff; }
.kpi.hot span{ color:rgba(255,255,255,.85); }
.qgrid{ display:grid; grid-template-columns:330px minmax(0,1fr); gap:16px; align-items:start; }
.serving{ position:relative; overflow:hidden; padding:22px; border-radius:32px; background:var(--teal); color:#fff; isolation:isolate; }
.serving::after{ content:''; position:absolute; z-index:-1; right:-50px; bottom:-60px; width:200px; height:190px; background:var(--teal-2); border-radius:58% 42% 55% 45% / 48% 56% 44% 52%; }
.serving small{ font-family:var(--mono); font-size:12.5px; letter-spacing:.14em; opacity:.7; }
.serving .num{ font-family:var(--serif); font-size:97px; line-height:.9; margin:10px 0 6px; }
.serving .who{ font-size:17px; font-weight:700; }
.serving .who span{ display:block; font-size:14px; font-weight:500; opacity:.7; }
.serving .btn{ --b:var(--accent); margin-top:18px; }
.serving .pulse-line{ margin-top:12px; height:34px; }
.qlist{ overflow:hidden; }
.qrow{ display:grid; grid-template-columns:56px minmax(0,1.3fr) 110px 120px 150px; align-items:center; gap:12px; padding:12px 18px; border-bottom:1px solid var(--line); font-size:15.5px; transition:background .3s; }
.qrow:last-child{ border-bottom:0; }
.qrow.hd{ font-size:13px; font-weight:800; color:var(--faint); text-transform:uppercase; letter-spacing:.06em; padding-top:14px; padding-bottom:10px; background:var(--surface-2); }
.qrow .tk{ font-family:var(--mono); font-weight:600; font-size:17px; width:42px; height:42px; display:grid; place-items:center; border-radius:50%; background:var(--surface-2); border:1.5px solid var(--line); }
.qrow.in{ background:var(--accent-soft); }
.qrow.in .tk{ background:var(--accent); color:#fff; border-color:var(--accent); }
.qrow.done{ opacity:.55; }
.qrow .nm strong{ display:block; }

.qrow .nm span{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block; }
.qrow .nm strong{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.qrow .nm span{ font-size:13.5px; color:var(--dim); }
.qrow .act{ display:flex; justify-content:flex-end; gap:6px; }
.qrow.flash{ animation:flash 1s ease 3; }
@keyframes flash{ 50%{ background:var(--accent-soft); } }
.consult{ margin-top:16px; padding:20px; display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:20px; }
.consult h3{ font-size:22px; margin-bottom:4px; }
.consult .sub{ color:var(--dim); font-size:15px; margin-bottom:14px; }
.medrow{ display:grid; grid-template-columns:minmax(0,1.5fr) 100px 110px 80px 40px; gap:8px; align-items:center; margin-bottom:8px; }
.medrow .input, .medrow .select{ min-height:42px; font-size:15px; padding:0 12px; }
.chips{ display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 12px; }
.chips button{ height:32px; padding:0 12px; border-radius:999px; border:1.5px dashed var(--teal-2); color:var(--teal); font-size:14px; font-weight:700; transition:all .2s; }
.chips button:hover{ background:var(--teal-soft); border-style:solid; }
.ptcard{ padding:16px; border-radius:24px; background:var(--surface-2); border:1px solid var(--line); font-size:15px; display:grid; gap:8px; align-content:start; }
.ptcard .row{ display:flex; justify-content:space-between; gap:8px; }
.ptcard .row span{ color:var(--dim); }
.vitals{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:6px; }
.vitals div{ padding:10px; border-radius:16px; background:#fff; border:1px solid var(--line); }
.vitals b{ display:block; font-family:var(--serif); font-size:21px; }
.vitals span{ font-size:12.5px; color:var(--dim); }
.sched{ overflow:auto; }
.sgrid{ display:grid; grid-template-columns:72px repeat(4, minmax(170px,1fr)); }
.sgrid .h{ position:sticky; top:0; z-index:2; padding:12px; background:var(--surface-2); border-bottom:1px solid var(--line); font-weight:800; font-size:15px; display:flex; align-items:center; gap:8px; }
.sgrid .h .av{ width:30px; height:30px; font-size:13px; }
.sgrid .tm{ padding:0 10px; height:44px; display:flex; align-items:center; font-family:var(--mono); font-size:13.5px; color:var(--faint); border-bottom:1px solid var(--line); }
.sgrid .cell{ height:44px; border-bottom:1px solid var(--line); border-left:1px solid var(--line); padding:4px; }
.sgrid .blk{ height:100%; border-radius:12px; padding:0 10px; display:flex; align-items:center; gap:6px; font-size:13.5px; font-weight:700; background:color-mix(in srgb, var(--c) 16%, #fff); color:color-mix(in srgb, var(--c) 70%, #000); border-left:4px solid var(--c); overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.sgrid .blk svg{ width:13px; height:13px; flex:none; }
.sgrid .blk.new{ animation:flash 1s ease 3; }
.ptable{ overflow:hidden; }
.prow{ display:grid; grid-template-columns:minmax(0,1.4fr) 120px 150px 110px 120px; gap:12px; align-items:center; padding:12px 18px; border-bottom:1px solid var(--line); font-size:15.5px; }
.prow.hd{ font-size:13px; font-weight:800; color:var(--faint); text-transform:uppercase; letter-spacing:.06em; background:var(--surface-2); }
.prow:last-child{ border-bottom:0; }
.prow .nm{ display:flex; align-items:center; gap:10px; }
.prow .nm .av{ width:36px; height:36px; font-size:14px; }
.search{ position:relative; width:320px; }
.search svg{ position:absolute; left:15px; top:50%; width:17px; height:17px; margin-top:-8.5px; color:var(--faint); }
.search .input{ padding-left:42px; min-height:44px; }
.dvroom{ position:fixed; inset:0; z-index:90; background:rgba(4,22,20,.8); backdrop-filter:blur(6px); display:grid; place-items:center; }
.dvbox{ width:min(92vw,980px); border-radius:34px; overflow:hidden; background:#06201E; color:#fff; display:grid; grid-template-columns:minmax(0,1fr) 300px; }
.dvbox .vfeed{ aspect-ratio:16/10; }
.dvside{ padding:20px; display:grid; gap:12px; align-content:start; background:#0A2D2A; }
.dvside h3{ font-size:21px; }
.dvside p{ font-size:15px; opacity:.75; }
.dvside .vbar{ background:none; padding:6px 0 0; justify-content:flex-start; }
.modal-scrim{ position:fixed; inset:0; z-index:85; background:rgba(11,43,41,.45); backdrop-filter:blur(3px); display:grid; place-items:center; }
.modal{ width:min(92vw,520px); max-height:90vh; overflow:auto; padding:24px; border-radius:32px; background:var(--bg); position:relative; }
.modal .x{ position:absolute; right:14px; top:14px; }
@media (max-width:900px){
  .cl{ grid-template-columns:1fr; }
  .rail{ position:sticky; z-index:30; height:auto; flex-direction:row; align-items:center; padding:10px 12px; overflow-x:auto; gap:4px; }
  .rail .brand{ padding:0 8px 0 0; }
  .rail .brand span, .rail .me{ display:none; }
  .rail nav{ display:flex; gap:4px; }
  .rail nav button{ height:40px; width:auto; padding:0 12px; font-size:14.5px; white-space:nowrap; }
  .cmain{ padding:16px 14px 30px; }
  .kpis{ grid-template-columns:repeat(2,1fr); }
  .qgrid, .consult{ grid-template-columns:1fr; }
  .qrow{ grid-template-columns:48px minmax(0,1fr) auto; }
  .qrow .tm, .qrow.hd{ display:none; }
  .qrow .act{ grid-column:2 / -1; justify-content:flex-start; }
  .qrow .st{ justify-self:end; }
  .medrow{ grid-template-columns:1fr 1fr; }
  .prow{ grid-template-columns:minmax(0,1fr) auto; }
  .prow > :nth-child(n+3), .prow.hd{ display:none; }
  .search{ width:100%; }
  .chead .right{ margin-left:0; width:100%; overflow-x:auto; }
  .dvbox{ grid-template-columns:1fr; }
}
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{ animation-duration:.01ms !important; transition-duration:.01ms !important; } }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="pulseline.js" defer></script>
</body>
