<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Academy</title>
<meta name="description" content="Your academy's own learning app: courses, live classes, announcements and progress.">
<meta name="robots" content="noindex, follow">
<!-- PWA: installable, full-screen on phones -->
<meta name="theme-color" content="#2952E3" id="metaTheme">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Academy" id="metaAppTitle">
<meta name="application-name" content="Academy" id="metaAppName">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="academyapp.webmanifest">
<link rel="icon" href="academyapp-icon.svg" id="linkIcon">
<link rel="apple-touch-icon" href="academyapp-icon.svg" id="linkTouch">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Brand tokens: overwritten at runtime from brandConfig */
:root{
  --bg:#F6F7FB;
  --text:#121528;
  --accent:#2952E3;          /* = brand primary */
  --p:#2952E3;
  --s:#FF9F1C;               /* brand secondary */
  --on-p:#FFFFFF;
  --on-s:#1A1200;
  --p-soft:color-mix(in srgb, var(--p) 12%, transparent);
  --p-deep:color-mix(in srgb, var(--p) 70%, #000);
  --surface:#FFFFFF;
  --surface-2:#EEF0F6;
  --dim:#5D6278;
  --faint:#9AA0B4;
  --line:#E3E6EF;
  --ok:#14A05C;
  --live:#EF3B3B;
  --gold:#E7A11A;
  --font:'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, monospace;
  --spring:cubic-bezier(.34,1.56,.64,1);
  --ease:cubic-bezier(.2,.8,.2,1);
  --nav-h:68px;
}
*{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
[hidden]{ display:none !important; }
html{ background:var(--bg); -webkit-text-size-adjust:100%; }
body{ background:var(--bg); color:var(--text); font-family:var(--font); font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased; overflow-x:clip; }
html, body{ scrollbar-width:none; } ::-webkit-scrollbar{ display:none; }
button, input, textarea, select{ font:inherit; color:inherit; }
button{ cursor:pointer; border:0; background:none; }
a{ color:inherit; text-decoration:none; }
img{ display:block; max-width:100%; }
:focus-visible{ outline:2px solid var(--p); outline-offset:2px; border-radius:10px; }
h1,h2,h3{ letter-spacing:-.02em; line-height:1.15; }
@media (min-width:520px){ body{ background:color-mix(in srgb, var(--p) 8%, #E9EBF2); } }
.shell{ position:relative; max-width:480px; min-height:100vh; min-height:100dvh; margin:0 auto; background:var(--bg); }
@media (min-width:520px){ .shell{ box-shadow:0 0 0 1px var(--line), 0 30px 80px -40px rgba(0,0,0,.35); } }

/* atoms */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:46px; padding:0 18px; border-radius:14px; font-weight:800; font-size:14.5px; white-space:nowrap; transition:transform .35s var(--spring), box-shadow .3s, background .2s, opacity .2s; }
.btn svg{ width:18px; height:18px; flex:none; }
.btn-p{ background:var(--p); color:var(--on-p); box-shadow:0 10px 22px -12px var(--p); }
.btn-p:hover{ box-shadow:0 0 0 4px var(--p-soft), 0 12px 26px -12px var(--p); }
.btn-s{ background:var(--s); color:var(--on-s); }
.btn-soft{ background:var(--surface-2); color:var(--text); }
.btn-line{ border:1.5px solid var(--line); background:var(--surface); }
.btn-line:hover{ border-color:var(--p); }
.btn-block{ width:100%; }
.btn-sm{ min-height:36px; padding:0 13px; font-size:13px; border-radius:11px; }
.btn:active{ transform:scale(.95); }
.btn[disabled]{ opacity:.45; pointer-events:none; }
.icon-btn{ width:40px; height:40px; border-radius:13px; display:inline-grid; place-items:center; color:var(--dim); transition:background .2s, color .2s, transform .3s var(--spring); position:relative; }
.icon-btn:hover{ background:var(--surface-2); color:var(--text); }
.icon-btn:active{ transform:scale(.9); }
.icon-btn svg{ width:20px; height:20px; }
.badge{ display:inline-flex; align-items:center; gap:4px; height:22px; padding:0 8px; border-radius:7px; font-size:11px; font-weight:800; letter-spacing:.02em; white-space:nowrap; }
.badge svg{ width:12px; height:12px; }
.b-free{ background:#E3F6EC; color:#0B7A3F; }
.b-paid{ background:#FFF0D4; color:#9A5800; }
.b-live{ background:var(--live); color:#fff; }
.b-p{ background:var(--p-soft); color:var(--p-deep); }
.dot{ width:7px; height:7px; border-radius:50%; background:currentColor; animation:blink 1.2s infinite; }
@keyframes blink{ 50%{ opacity:.3; } }
.logo{ display:grid; place-items:center; overflow:hidden; flex:none; background:var(--p); color:var(--on-p); font-weight:800; letter-spacing:-.02em; }
.logo img{ width:100%; height:100%; object-fit:cover; }
.field{ display:grid; gap:6px; margin-bottom:12px; }
.field label{ font-size:12.5px; font-weight:700; color:var(--dim); }
.input, .textarea, .select{ width:100%; min-height:46px; padding:0 14px; border-radius:13px; border:1.5px solid var(--line); background:var(--surface); outline:none; font-size:15px; transition:border-color .2s, box-shadow .25s; }
.textarea{ padding:12px 14px; min-height:86px; resize:none; }
.input:focus, .textarea:focus, .select:focus{ border-color:var(--p); box-shadow:0 0 0 4px var(--p-soft); }
.input.bad{ border-color:var(--live); }
.err{ color:var(--live); font-size:12.5px; font-weight:600; }
.hint{ color:var(--faint); font-size:12.5px; }
.seg{ display:inline-flex; padding:3px; border-radius:12px; background:var(--surface-2); }
.seg button{ height:34px; padding:0 14px; border-radius:9px; font-size:13px; font-weight:800; color:var(--dim); transition:background .25s, color .25s; }
.seg button[aria-pressed="true"]{ background:var(--surface); color:var(--text); box-shadow:0 2px 8px -3px rgba(0,0,0,.2); }
.switch{ width:48px; height:28px; border-radius:999px; background:#D5D8E2; position:relative; flex:none; transition:background .3s; }
.switch::after{ content:''; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:#fff; box-shadow:0 2px 6px rgba(0,0,0,.2); transition:transform .45s var(--spring); }
.switch[aria-checked="true"]{ background:var(--p); }
.switch[aria-checked="true"]::after{ transform:translateX(20px); }
.switch.live[aria-checked="true"]{ background:var(--live); }
.card{ background:var(--surface); border:1px solid var(--line); border-radius:20px; }
.sec-h{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:22px 0 10px; }
.sec-h h2{ font-size:18px; }
.sec-h button{ font-size:13px; font-weight:800; color:var(--p); }
.empty{ text-align:center; color:var(--dim); padding:26px 14px; font-size:14px; }

/* ---------- splash + login ---------- */
.splash{ position:relative; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; overflow:hidden; isolation:isolate; background:linear-gradient(160deg, var(--p) 0%, var(--p-deep) 70%); color:var(--on-p); }
.splash::before{ content:''; position:absolute; z-index:-1; width:420px; height:420px; right:-160px; top:-120px; border-radius:50%; background:radial-gradient(closest-side, color-mix(in srgb, var(--s) 60%, transparent), transparent); opacity:.7; }
.splash::after{ content:''; position:absolute; z-index:-1; inset:0; background-image:radial-gradient(rgba(255,255,255,.12) 1px, transparent 1.5px); background-size:22px 22px; mask-image:linear-gradient(180deg,#000,transparent 70%); -webkit-mask-image:linear-gradient(180deg,#000,transparent 70%); }
.sp-brand{ flex:1; display:grid; place-items:center; align-content:center; gap:16px; padding:40px 24px 24px; text-align:center; }
.sp-brand .logo{ width:96px; height:96px; border-radius:30px; font-size:36px; background:#fff; color:var(--p); box-shadow:0 24px 50px -18px rgba(0,0,0,.5); }
.sp-brand h1{ font-size:30px; max-width:14ch; }
.sp-brand p{ opacity:.8; font-size:14.5px; max-width:30ch; }
.login{ background:var(--bg); color:var(--text); border-radius:30px 30px 0 0; padding:24px 20px calc(24px + env(safe-area-inset-bottom)); }
.login h2{ font-size:21px; }
.login > p{ color:var(--dim); font-size:13.5px; margin:4px 0 16px; }
.demo-pick{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.demo-pick button{ text-align:left; padding:14px; border-radius:18px; border:1.5px solid var(--line); background:var(--surface); transition:border-color .25s, transform .35s var(--spring), box-shadow .25s; }
.demo-pick button:hover{ border-color:var(--p); transform:translateY(-2px); box-shadow:0 0 0 4px var(--p-soft); }
.demo-pick strong{ display:block; font-size:14.5px; margin-top:8px; }
.demo-pick span{ font-size:12px; color:var(--dim); }
.or{ display:flex; align-items:center; gap:10px; margin:18px 0 12px; color:var(--faint); font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; }
.or::before, .or::after{ content:''; flex:1; height:1px; background:var(--line); }
.owner-link{ display:block; margin:14px auto 0; font-size:13px; font-weight:700; color:var(--dim); }
.owner-link b{ color:var(--p); }

/* ---------- app chrome ---------- */
.top{ position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:10px; padding:12px 16px; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
.top .logo{ width:38px; height:38px; border-radius:12px; font-size:15px; }
.top .nm{ flex:1; min-width:0; }
.top .nm strong{ display:block; font-size:15.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.top .nm span{ display:block; font-size:12px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.top .pip{ position:absolute; top:8px; right:8px; width:8px; height:8px; border-radius:50%; background:var(--live); box-shadow:0 0 0 2px var(--bg); }
.customize{ opacity:.55; }
.customize:hover{ opacity:1; }
.page{ padding:4px 16px calc(var(--nav-h) + 30px + env(safe-area-inset-bottom)); }
.owner-bar{ display:flex; align-items:center; gap:8px; margin:0 16px 6px; padding:8px 12px; border-radius:12px; background:var(--text); color:var(--bg); font-size:12.5px; font-weight:700; }
.owner-bar svg{ width:16px; height:16px; color:var(--s); }
.nav{ position:fixed; z-index:40; bottom:0; left:50%; transform:translateX(-50%); width:min(100%,480px); display:flex; padding:8px 10px calc(8px + env(safe-area-inset-bottom)); background:color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border-top:1px solid var(--line); }
.nav button{ flex:1; display:grid; justify-items:center; gap:3px; padding:6px 0 4px; font-size:11px; font-weight:700; color:var(--faint); position:relative; transition:color .25s; }
.nav button i{ display:grid; place-items:center; width:56px; height:30px; border-radius:15px; transition:background .3s; }
.nav button svg{ width:21px; height:21px; transition:transform .4s var(--spring); }
.nav button[aria-selected="true"]{ color:var(--p); }
.nav button[aria-selected="true"] i{ background:var(--p-soft); }
.nav button[aria-selected="true"] svg{ transform:scale(1.08); }
.nav .ndot{ position:absolute; top:4px; left:calc(50% + 10px); width:8px; height:8px; border-radius:50%; background:var(--live); }

/* home */
.hello{ margin:6px 0 14px; }
.hello p{ color:var(--dim); font-size:13.5px; }
.hello h1{ font-size:24px; margin-top:2px; }
.banner{ position:relative; overflow:hidden; border-radius:24px; padding:20px 18px; color:var(--on-p); background:linear-gradient(135deg, var(--p) 0%, var(--p-deep) 100%); isolation:isolate; min-height:160px; display:flex; flex-direction:column; justify-content:flex-end; }
.banner::before{ content:''; position:absolute; z-index:-1; right:-50px; top:-50px; width:200px; height:200px; border-radius:50%; background:var(--s); opacity:.85; }
.banner::after{ content:''; position:absolute; z-index:-1; right:40px; top:60px; width:90px; height:90px; border-radius:50%; border:12px solid rgba(255,255,255,.18); }
.banner .badge{ background:rgba(255,255,255,.2); color:inherit; align-self:flex-start; }
.banner h2{ font-size:22px; margin:10px 0 4px; max-width:16ch; }
.banner p{ font-size:13.5px; opacity:.85; max-width:30ch; }
.banner .btn{ align-self:flex-start; margin-top:14px; background:#fff; color:var(--p-deep); min-height:40px; }
.live-strip{ display:flex; align-items:center; gap:12px; margin-top:12px; padding:12px 12px 12px 14px; border-radius:18px; background:var(--text); color:var(--bg); }
.live-strip .t{ flex:1; min-width:0; }
.live-strip strong{ display:block; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.live-strip span{ font-size:12px; opacity:.7; }
.live-strip .btn{ min-height:38px; background:var(--live); color:#fff; }
.cont{ display:flex; gap:12px; align-items:center; padding:10px; }
.cont .th{ width:112px; aspect-ratio:16/9; border-radius:12px; overflow:hidden; background:#000; flex:none; position:relative; }
.cont .th img{ width:100%; height:100%; object-fit:cover; }
.cont .th svg{ position:absolute; left:50%; top:50%; width:28px; height:28px; margin:-14px 0 0 -14px; color:#fff; filter:drop-shadow(0 2px 6px rgba(0,0,0,.5)); }
.cont .t{ flex:1; min-width:0; }
.cont strong{ display:block; font-size:14px; }
.cont span{ font-size:12px; color:var(--dim); }
.ann{ display:flex; gap:12px; padding:14px; }
.ann + .ann{ border-top:1px solid var(--line); }
.ann i{ width:36px; height:36px; border-radius:12px; display:grid; place-items:center; background:var(--p-soft); color:var(--p); flex:none; }
.ann i svg{ width:18px; height:18px; }
.ann p{ font-size:14px; overflow-wrap:anywhere; }
.ann span{ display:block; font-size:11.5px; color:var(--faint); margin-top:3px; }
.rail{ display:grid; grid-auto-flow:column; grid-auto-columns:72%; gap:12px; overflow-x:auto; scroll-snap-type:x mandatory; margin:0 -16px; padding:2px 16px 8px; scrollbar-width:none; }
.rail::-webkit-scrollbar{ display:none; }
.ccard{ scroll-snap-align:start; text-align:left; border-radius:20px; overflow:hidden; background:var(--surface); border:1px solid var(--line); transition:transform .4s var(--spring), box-shadow .3s; }
.ccard:hover{ transform:translateY(-3px); box-shadow:0 16px 30px -18px rgba(0,0,0,.35); }
.ccard .cv{ aspect-ratio:16/9; position:relative; background:#000; }
.ccard .cv img{ width:100%; height:100%; object-fit:cover; opacity:.92; }
.ccard .cv .badge{ position:absolute; left:10px; top:10px; }
.ccard .cb{ padding:12px 14px 14px; }
.ccard strong{ display:block; font-size:15px; }
.ccard span{ font-size:12px; color:var(--dim); }
.prog{ height:6px; border-radius:6px; background:var(--surface-2); overflow:hidden; margin-top:10px; }
.prog i{ display:block; height:100%; border-radius:6px; background:var(--p); transition:width .8s var(--ease); }

/* courses */
.course{ display:flex; gap:12px; align-items:center; width:100%; text-align:left; padding:12px; margin-bottom:10px; transition:transform .35s var(--spring), border-color .25s; }
.course:hover{ border-color:var(--p); transform:translateY(-2px); }
.course .cv{ width:84px; aspect-ratio:1; border-radius:16px; overflow:hidden; flex:none; position:relative; background:var(--p); }
.course .cv img{ width:100%; height:100%; object-fit:cover; }
.course .t{ flex:1; min-width:0; }
.course strong{ display:block; font-size:15px; }
.course span{ font-size:12.5px; color:var(--dim); }
.back-row{ display:flex; align-items:center; gap:6px; margin:4px 0 10px; font-weight:800; font-size:14px; color:var(--p); }
.back-row svg{ width:18px; height:18px; }
.c-hero{ border-radius:22px; overflow:hidden; position:relative; aspect-ratio:16/9; background:#000; }
.c-hero img{ width:100%; height:100%; object-fit:cover; opacity:.75; }
.c-hero div{ position:absolute; inset:auto 0 0; padding:16px; color:#fff; background:linear-gradient(transparent, rgba(0,0,0,.75)); }
.c-hero h1{ font-size:22px; }
.c-hero p{ font-size:12.5px; opacity:.85; }
.lec{ display:flex; gap:12px; align-items:center; width:100%; text-align:left; padding:10px 0; border-bottom:1px solid var(--line); }
.lec:last-child{ border-bottom:0; }
.lec .n{ width:34px; height:34px; border-radius:11px; display:grid; place-items:center; background:var(--surface-2); font-family:var(--mono); font-size:12px; color:var(--dim); flex:none; }
.lec.done .n{ background:#E3F6EC; color:var(--ok); }
.lec.locked .n{ background:#FFF0D4; color:#9A5800; }
.lec .n svg{ width:16px; height:16px; }
.lec .t{ flex:1; min-width:0; }
.lec strong{ display:block; font-size:14px; }
.lec span{ font-size:12px; color:var(--faint); }
.lec > svg{ width:20px; height:20px; color:var(--p); flex:none; }

/* live */
.live-hero{ position:relative; overflow:hidden; border-radius:24px; padding:18px; background:var(--text); color:var(--bg); isolation:isolate; }
.live-hero::before{ content:''; position:absolute; z-index:-1; right:-40px; bottom:-60px; width:220px; height:220px; border-radius:50%; background:radial-gradient(closest-side, color-mix(in srgb, var(--live) 50%, transparent), transparent); }
.live-hero h2{ font-size:21px; margin:12px 0 4px; }
.live-hero p{ font-size:13px; opacity:.7; }
.live-hero .btn{ margin-top:16px; }
.golive{ padding:14px; display:grid; gap:12px; margin-bottom:14px; border:1.5px dashed var(--p); background:var(--p-soft); }
.golive .row{ display:flex; align-items:center; gap:12px; }
.golive strong{ font-size:14.5px; flex:1; }
.sched{ display:flex; gap:12px; align-items:center; padding:12px 14px; }
.sched + .sched{ border-top:1px solid var(--line); }
.sched .d{ width:52px; text-align:center; flex:none; border-radius:14px; padding:6px 0; background:var(--p-soft); color:var(--p-deep); }
.sched .d b{ display:block; font-size:18px; line-height:1.1; }
.sched .d span{ font-size:10.5px; font-weight:800; text-transform:uppercase; }
.sched .t{ flex:1; min-width:0; }
.sched strong{ display:block; font-size:14px; }
.sched .t span{ font-size:12px; color:var(--dim); }
.remind{ height:34px; padding:0 12px; border-radius:10px; border:1.5px solid var(--line); font-size:12.5px; font-weight:800; color:var(--dim); display:inline-flex; align-items:center; gap:5px; transition:all .25s; }
.remind svg{ width:15px; height:15px; }
.remind[aria-pressed="true"]{ background:var(--p); border-color:var(--p); color:var(--on-p); }

/* profile */
.me{ display:flex; align-items:center; gap:14px; padding:16px; }
.me .av{ width:58px; height:58px; border-radius:20px; display:grid; place-items:center; font-weight:800; font-size:20px; background:var(--s); color:var(--on-s); flex:none; }
.me strong{ display:block; font-size:17px; }
.me span{ font-size:12.5px; color:var(--dim); overflow-wrap:anywhere; }
.stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px; }
.stat{ padding:12px; border-radius:16px; background:var(--surface); border:1px solid var(--line); text-align:center; }
.stat b{ display:block; font-size:20px; }
.stat span{ font-size:11.5px; color:var(--dim); }
.menu-list{ overflow:hidden; }
.mrow{ display:flex; align-items:center; gap:12px; width:100%; padding:14px 16px; text-align:left; font-weight:700; font-size:14.5px; }
.mrow + .mrow{ border-top:1px solid var(--line); }
.mrow > svg{ width:20px; height:20px; color:var(--p); flex:none; }
.mrow .t{ flex:1; min-width:0; }
.mrow .t span{ display:block; font-weight:500; font-size:12px; color:var(--dim); }
.mrow .chev{ width:18px; height:18px; color:var(--faint); }
.studio{ padding:16px; margin-top:12px; }
.studio h3{ font-size:16px; display:flex; align-items:center; gap:8px; margin-bottom:12px; }
.studio h3 svg{ width:18px; height:18px; color:var(--p); }
.studio + .studio{ margin-top:12px; }
.yt-ok{ display:flex; align-items:center; gap:10px; font-size:12.5px; font-weight:700; color:var(--ok); margin:-4px 0 12px; }
.yt-ok img{ width:64px; aspect-ratio:16/9; object-fit:cover; border-radius:6px; }
.foot-note{ text-align:center; color:var(--faint); font-size:11.5px; margin-top:22px; }

/* sheets + player */
.scrim{ position:fixed; inset:0; z-index:80; background:rgba(10,12,24,.55); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); display:flex; align-items:flex-end; justify-content:center; }
.sheet{ position:relative; width:min(100%,480px); max-height:92vh; max-height:92dvh; overflow:auto; background:var(--bg); border-radius:26px 26px 0 0; padding:20px 18px calc(22px + env(safe-area-inset-bottom)); }
.sheet::before{ content:''; display:block; width:40px; height:4px; border-radius:4px; background:var(--line); margin:-8px auto 14px; }
.sheet .x{ position:absolute; right:12px; top:12px; }
.sheet h2{ font-size:22px; padding-right:40px; }
.sheet .lead{ color:var(--dim); font-size:14px; margin-top:6px; }
.player{ position:relative; aspect-ratio:16/9; border-radius:16px; overflow:hidden; background:#000; margin:-4px 0 14px; }
.player iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }
.wm{ position:absolute; z-index:2; left:10%; top:20%; pointer-events:none; font-family:var(--mono); font-size:11px; color:#fff; opacity:.28; text-shadow:0 1px 2px rgba(0,0,0,.8); white-space:nowrap; transition:left 2.6s var(--ease), top 2.6s var(--ease); user-select:none; }
.wm-tile{ position:absolute; z-index:1; inset:0; pointer-events:none; opacity:.06; background-image:repeating-linear-gradient(-30deg, transparent 0 60px, #fff 60px 61px); }
.price{ display:flex; align-items:baseline; gap:8px; margin:16px 0 4px; }
.price b{ font-size:38px; letter-spacing:-.03em; }
.price span{ color:var(--dim); }
.perks{ list-style:none; display:grid; gap:9px; margin:14px 0 18px; font-size:14px; }
.perks li{ display:flex; gap:10px; }
.perks svg{ width:18px; height:18px; color:var(--ok); flex:none; margin-top:1px; }
.pay-m{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px; }
.pay-m button{ height:48px; border-radius:13px; border:1.5px solid var(--line); font-weight:800; font-size:13px; color:var(--dim); transition:all .25s; }
.pay-m button[aria-pressed="true"]{ border-color:var(--p); color:var(--p); background:var(--p-soft); }
.center{ display:grid; justify-items:center; gap:12px; text-align:center; padding:24px 0 10px; }
.spinner{ width:46px; height:46px; border-radius:50%; border:4px solid var(--surface-2); border-top-color:var(--p); animation:spin .8s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }
.tick{ width:66px; height:66px; border-radius:50%; background:var(--ok); color:#fff; display:grid; place-items:center; }
.tick svg{ width:32px; height:32px; }

/* live room */
.room{ position:fixed; inset:0; z-index:70; display:flex; flex-direction:column; background:#0B0D18; color:#fff; max-width:480px; margin:0 auto; }
.room-top{ display:flex; align-items:center; gap:10px; padding:12px 14px; }
.room-top strong{ flex:1; min-width:0; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.room-top .v{ font-family:var(--mono); font-size:11.5px; opacity:.6; }
.stream{ position:relative; aspect-ratio:16/10; overflow:hidden; background:radial-gradient(120% 90% at 30% 20%, color-mix(in srgb, var(--p) 70%, #000), #05060C 70%); flex:none; }
.slide{ position:absolute; left:6%; top:12%; width:58%; padding:14px; border-radius:12px; background:rgba(255,255,255,.95); color:#121528; box-shadow:0 20px 40px -20px rgba(0,0,0,.8); }
.slide small{ display:block; font-size:9px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--p); }
.slide b{ display:block; font-size:15px; margin:4px 0 8px; }
.slide i{ display:block; height:6px; border-radius:3px; background:#E3E6EF; margin-top:6px; transform-origin:left; }
.teacher{ position:absolute; right:5%; bottom:8%; width:30%; aspect-ratio:3/4; border-radius:14px; overflow:hidden; background:linear-gradient(180deg, #2B2F45, #161927); border:2px solid rgba(255,255,255,.2); display:grid; place-items:end center; }
.teacher svg{ width:84%; }
.teacher span{ position:absolute; left:6px; top:6px; font-size:9.5px; font-weight:800; background:rgba(0,0,0,.5); padding:2px 6px; border-radius:6px; }
.stream .badge{ position:absolute; left:10px; top:10px; }
.wave{ position:absolute; left:6%; bottom:9%; display:flex; gap:3px; align-items:flex-end; height:22px; }
.wave i{ width:4px; border-radius:2px; background:var(--s); animation:wv 1s ease-in-out infinite; }
@keyframes wv{ 0%,100%{ height:20%; } 50%{ height:100%; } }
.chat{ flex:1; min-height:0; display:flex; flex-direction:column; background:#11142200; }
.msgs{ flex:1; min-height:0; overflow-y:auto; padding:12px 14px; display:flex; flex-direction:column; gap:10px; }
.msg{ display:flex; gap:9px; font-size:13.5px; }
.msg .av{ width:28px; height:28px; border-radius:9px; display:grid; place-items:center; font-size:11px; font-weight:800; flex:none; }
.msg b{ display:block; font-size:11.5px; opacity:.6; }
.msg b em{ font-style:normal; margin-left:5px; padding:1px 5px; border-radius:4px; background:var(--p); color:var(--on-p); opacity:1; }
.msg p{ overflow-wrap:anywhere; }
.chat-form{ display:flex; gap:8px; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); border-top:1px solid rgba(255,255,255,.08); }
.chat-form input{ flex:1; min-width:0; height:44px; border-radius:999px; padding:0 16px; background:rgba(255,255,255,.08); border:1.5px solid rgba(255,255,255,.1); color:#fff; outline:none; }
.chat-form input:focus{ border-color:var(--p); }
.chat-form .btn{ width:44px; padding:0; border-radius:50%; }

/* customizer drawer */
.drawer-scrim{ position:fixed; inset:0; z-index:90; background:rgba(10,12,24,.4); }
.drawer{ position:fixed; z-index:91; top:0; bottom:0; right:0; width:min(92%,380px); background:var(--surface); box-shadow:-30px 0 60px -30px rgba(0,0,0,.5); padding:18px 18px 28px; overflow-y:auto; }
.drawer h2{ font-size:19px; display:flex; align-items:center; gap:8px; }
.drawer h2 svg{ width:20px; height:20px; color:var(--p); }
.drawer .lead{ color:var(--dim); font-size:13px; margin:4px 0 16px; }
.drawer .x{ position:absolute; right:10px; top:10px; }
.sw-row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.sw-row{ gap:7px; }
.sw{ width:30px; height:30px; border-radius:10px; background:var(--c); box-shadow:inset 0 0 0 1px rgba(0,0,0,.12); transition:transform .3s var(--spring), box-shadow .25s; }
.sw[aria-pressed="true"]{ box-shadow:0 0 0 3px var(--surface), 0 0 0 5px var(--c); }
.sw:hover{ transform:scale(1.1); }
.picker{ position:relative; width:30px; height:30px; border-radius:10px; overflow:hidden; background:conic-gradient(red, yellow, lime, aqua, blue, magenta, red); }
.picker input{ position:absolute; inset:-8px; width:48px; height:48px; opacity:0; cursor:pointer; }
.logo-row{ display:flex; gap:10px; align-items:center; }
.logo-row .logo{ width:52px; height:52px; border-radius:16px; font-size:20px; }
.preview-chip{ display:flex; align-items:center; gap:10px; padding:10px; border-radius:16px; background:var(--surface-2); margin-bottom:16px; }
.preview-chip .logo{ width:40px; height:40px; border-radius:12px; font-size:15px; }
.preview-chip strong{ font-size:14px; }
.preview-chip span{ display:block; font-size:11.5px; color:var(--dim); }

.toasts{ position:fixed; z-index:100; left:50%; top:12px; transform:translateX(-50%); display:grid; gap:8px; width:min(92vw,420px); pointer-events:none; }
.toast{ display:flex; align-items:center; gap:10px; padding:12px 16px; border-radius:16px; background:var(--text); color:var(--bg); font-size:13.5px; font-weight:600; box-shadow:0 16px 32px -12px rgba(0,0,0,.45); }
.toast svg{ width:18px; height:18px; color:var(--s); flex:none; }
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{ animation-duration:.01ms !important; transition-duration:.01ms !important; } }
</style>
</head>
<body>
<div class="shell" id="app" aria-live="polite"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" integrity="sha512-7eHRwcbYkK4d9g/6tD/mhkf++eoTHwpNM9woBxtPUBWm67zeAfFC+HrdoE2GanKeocly/VxeLvIqwvCdk7qScg==" crossorigin="anonymous" defer></script>
<script src="academyapp.js" defer></script>
</body>
</html>
