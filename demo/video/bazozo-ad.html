<main>
  <section class="shell" id="shell" aria-label="Bazozo studio commercial">
    <div class="fit" id="fit">
      <div class="rig" id="camera-rig" data-vibe="pop">
        <div class="shaker" id="shaker"><div class="cam" id="camera-stage"></div></div>
        <i class="invert" id="invert"></i>
        <div class="over" id="overlay"></div>
        <div class="hud" aria-hidden="true">
          <div class="hud-bpm mono"><i id="bpmDot"></i><b id="bpmLabel">161 BPM</b><span class="hud-dots" id="beatDots"><i></i><i></i><i></i><i></i></span></div>
          <div class="hud-tc mono"><span id="hudScene">01 LAPTOP</span><b id="hudTc">00:00:00</b><span id="hudBeat">BEAT 01/48</span></div>
          <div class="hud-spec" id="spec"></div>
        </div>
        <button class="sound" id="soundPill" type="button">🔇 Tap for the beat</button>
      </div>
    </div>
  </section>

  <section class="director" aria-label="Director controls">
    <div class="dir-row">
      <div class="dir-group">
        <button type="button" class="nb primary" id="playBtn" aria-label="Pause">❚❚ Pause</button>
        <button type="button" class="nb" id="restartBtn">↺ Restart</button>
        <button type="button" class="nb" id="loopBtn" aria-pressed="false">∞ Loop: off</button>
        <button type="button" class="nb" id="audioBtn" aria-pressed="false">🔇 Unmute beat</button>
      </div>
      <div class="dir-group" role="group" aria-label="Colour vibe">
        <span class="dir-k mono">Vibe</span>
        <button type="button" class="vb" data-vibe="pop" aria-pressed="true"><i></i>Electric Pop</button>
        <button type="button" class="vb" data-vibe="solar" aria-pressed="false"><i></i>Solar Hyper</button>
        <button type="button" class="vb" data-vibe="cyber" aria-pressed="false"><i></i>Cyber Neon</button>
      </div>
    </div>
    <div class="dir-row">
      <div class="dir-group" role="group" aria-label="Playback speed">
        <span class="dir-k mono">Speed</span>
        <button type="button" class="sp" data-rate="0.5" aria-pressed="false">0.5×</button>
        <button type="button" class="sp" data-rate="0.75" aria-pressed="false">0.75×</button>
        <button type="button" class="sp" data-rate="1" aria-pressed="true">1×</button>
        <button type="button" class="sp" data-rate="1.25" aria-pressed="false">1.25×</button>
        <button type="button" class="sp" data-rate="1.5" aria-pressed="false">1.5×</button>
        <button type="button" class="sp" data-rate="2" aria-pressed="false">2×</button>
      </div>
      <div class="dir-group" role="group" aria-label="Jump to scene" id="jumps">
        <span class="dir-k mono">Scenes</span>
      </div>
    </div>
    <div class="seq" id="seq" aria-label="Timeline sequencer">
      <div class="seq-ruler mono" id="seqRuler"></div>
      <div class="seq-tracks" id="seqTracks"></div>
      <div class="seq-head" id="seqHead"></div>
    </div>
    <p class="dir-note mono">Built live in the browser: DOM + SVG + GSAP master timeline, Web Audio beat synth, royalty-free Pexels footage. <a href="../../index.html#contact">Want one for your brand?</a></p>
  </section>
</main>
